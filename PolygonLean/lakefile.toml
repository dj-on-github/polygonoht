name = "PolygonLean"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["PolygonLean"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3
weak.linter.style.header = false # not a Mathlib file: no copyright header

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.0"

[[lean_lib]]
name = "PolygonLean"
